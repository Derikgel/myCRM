x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: mycrm:latest
  restart: unless-stopped
  volumes:
    - ./.env:/var/www/html/.env
    - storage_data:/var/www/html/storage

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy's own {$DOMAIN:80} Caddyfile fallback only applies when the
      # variable is entirely unset, not when it's set-but-empty -- and
      # `environment:` always sets it. So resolve the empty case here,
      # where compose's ${VAR:-default} does treat empty as unset.
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *app
    expose:
      - "80"
    environment:
      CONTAINER_ROLE: app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--sleep=3", "--max-time=3600"]
    environment:
      CONTAINER_ROLE: queue
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mycrm}
      MYSQL_USER: ${DB_USERNAME:-mycrm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  mysql_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
